<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Tactical Gradient matching your UI -->
    <linearGradient id="nexusGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" /> <!-- Tailwind cyan-400 -->
      <stop offset="100%" stop-color="#3b82f6" /> <!-- Tailwind blue-500 -->
    </linearGradient>
  </defs>

  <!-- Dark Base Background -->
  <rect width="512" height="512" rx="120" fill="#050505" />
  
  <!-- Subtle Outer Border -->
  <rect width="512" height="512" rx="120" fill="none" stroke="#171717" stroke-width="16" />

  <!-- Outer Crosshairs -->
  <path d="M 256 72 L 256 136 M 256 376 L 256 440 M 72 256 L 136 256 M 376 256 L 440 256" 
        stroke="url(#nexusGradient)" 
        stroke-width="32" 
        stroke-linecap="round" />

  <!-- Radar / Perimeter Ring -->
  <circle cx="256" cy="256" r="160" 
          stroke="url(#nexusGradient)" 
          stroke-width="32" 
          fill="none" />

  <!-- Inner Network Node (Pulse) -->
  <circle cx="256" cy="256" r="64" fill="url(#nexusGradient)" />
  
  <!-- Inner Cutout (Creates the 'N' geometry illusion) -->
  <path d="M 224 224 L 288 288 M 288 224 L 224 288" 
        stroke="#050505" 
        stroke-width="24" 
        stroke-linecap="round" />
</svg>
